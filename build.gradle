plugins {
    id 'java'
    id 'application'
}

group = 'edu.mcw.rgd'
version = '1.0.0'

sourceCompatibility = '17'
targetCompatibility = '17'

mainClassName = 'edu.mcw.rgd.expression.processor.ExpressionObservationProcessor'
String myAppName="exp-data-json-generator"

// Set the JAR file base name
project.archivesBaseName = myAppName

repositories {
    mavenCentral()
}

dependencies {
    // Local libraries
    implementation fileTree(dir: 'lib', include: '*.jar')

    // JSON processing
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.14.1'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.14.1'

    // Database
    implementation 'org.springframework:spring-jdbc:6.1.1'
    implementation 'org.springframework:spring-beans:6.1.1'
    implementation 'com.oracle.database.jdbc:ojdbc11:23.2.0.0'
    implementation 'org.apache.commons:commons-dbcp2:2.9.0'

    // Logging
    implementation 'org.apache.logging.log4j:log4j-api:2.19.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.19.0'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
startScripts {
    applicationName = myAppName
}
// Task to update rgdcore from the source library
task update_rgdcore(type: Copy) {
    from file("../../rgd-core-library/dist/rgdcore_1.1.3.jar")
    into file("lib/")
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes(
            'Built-By': System.getProperty('user.name'),
            'Built-Date': new Date(),
            'Built-JDK': System.getProperty('java.version'),
            'Class-Path': configurations.runtimeClasspath.collect { it.getName() }.join(' '),
            'Main-Class': mainClassName
        )
    }
}
distributions {
    main {
        //baseName = myAppName
        distributionBaseName = myAppName
    }
}
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
